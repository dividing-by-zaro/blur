name: Blur

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# The only runnable scheme. Declaring it explicitly writes it into
# xcshareddata, so regenerating the project can't shuffle the selection onto the
# widget — which isn't launchable at all: the bundle holds a Live Activity and no
# home-screen widget, so SpringBoard has no descriptors to show for it.
schemes:
  Blur:
    build:
      targets:
        Blur: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  # ---------------------------------------------------------------- app
  Blur:
    type: application
    platform: iOS
    sources:
      - path: Blur
      - path: Shared
    dependencies:
      - target: BlurWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.blur
        PRODUCT_NAME: Blur
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Blur/Info.plist
      properties:
        CFBundleDisplayName: Blur
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # Force light mode — the design is light-mode only by intent.
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # AlarmKit — required, app cannot schedule alarms without it.
        NSAlarmKitUsageDescription: >-
          Blur uses alarms so your timers and wake-ups ring reliably, even when
          your phone is silenced or in a Focus mode.
        # No microphone or speech-recognition keys: voice input is the keyboard's
        # own dictation key, which the system owns end to end. The app never
        # opens an audio session, so it needs no permission of its own.
        # Live Activity presentation for running timers and ringing alarms.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true

  # ------------------------------------------------------- widget (LA UI)
  BlurWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BlurWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.blur.widget
        PRODUCT_NAME: BlurWidget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: BlurWidget/Info.plist
      properties:
        CFBundleDisplayName: Blur
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
